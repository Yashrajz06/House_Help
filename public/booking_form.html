<!DOCTYPE html>
<html>
<head>
    <title>Booking Master Entry</title>
    <link rel="stylesheet" href="css/common.css">
    <style>
        .form-row, .form-row-full {
            grid-template-columns: 220px 1fr;
        }
    </style>
</head>
<body>
    <div class="page-border">
        <div class="title-main">House Help Management System</div>
        <div class="title-sub">Booking Transcation Entry</div>
        <p id="msg"></p>
        <div class="form-container">
            <div class="form-row">
                <label>Booking ID <span>*</span></label>
                <div class="id-section">
                    <input type="text" id="bookingId" readonly maxlength="10"
                        style="width: 150px; background-color:#eee; cursor:not-allowed;">
                    <div class="mode-toggle">
                        <button type="button" id="findModeBtn" class="toggle-btn"
                            onclick="navigateWithCheck(function(){ set_mode('Find'); })">Find</button>
                        <button type="button" id="newModeBtn" class="toggle-btn active"
                            onclick="navigateWithCheck(function(){ set_mode('New'); })">New</button>
                    </div>
                </div>
            </div>
            <div class="form-row">
                <label>Category <span>*</span></label>
                <div style="position: relative; width: 100%;">
                    <div class="custom-dropdown" id="dropdownContainer_categoryId">
                    <input type="text" id="categoryId_display" readonly placeholder="" onclick="toggleDropdown('categoryId')">
                    <input type="hidden" id="categoryId">
                    <div id="tableContainer_categoryId" class="dropdown-table-container">
                        <table class="dropdown-table" id="table_categoryId">
                            <thead>
                                <tr>
                                <th>Category ID</th>
                                <th>Category Name</th>
                                </tr>
                            </thead>
                            <tbody>
                            </tbody>
                        </table>
                    </div>
                </div>
                    <div id="categoryIdMsg" class="smallMsg"></div>
                </div>
            </div>
            <div class="form-row">
                <label>Customer <span>*</span></label>
                <div style="position: relative; width: 100%;">
                    <div class="custom-dropdown" id="dropdownContainer_customerId">
                    <input type="text" id="customerId_display" readonly placeholder="" onclick="toggleDropdown('customerId')">
                    <input type="hidden" id="customerId">
                    <div id="tableContainer_customerId" class="dropdown-table-container">
                        <table class="dropdown-table" id="table_customerId">
                            <thead>
                                <tr>
                                <th>Customer ID</th>
                                <th>Customer Name</th>
                                </tr>
                            </thead>
                            <tbody>
                            </tbody>
                        </table>
                    </div>
                </div>
                    <div id="customerIdMsg" class="smallMsg"></div>
                </div>
            </div>
            <div class="form-row">
                <label>Provider <span>*</span></label>
                <div style="position: relative; width: 100%;">
                    <div class="custom-dropdown" id="dropdownContainer_providerId">
                    <input type="text" id="providerId_display" readonly placeholder="" onclick="toggleDropdown('providerId')">
                    <input type="hidden" id="providerId">
                    <div id="tableContainer_providerId" class="dropdown-table-container">
                        <table class="dropdown-table" id="table_providerId">
                            <thead>
                                <tr>
                                <th>Provider ID</th>
                                <th>Provider Name</th>
                                </tr>
                            </thead>
                            <tbody>
                            </tbody>
                        </table>
                    </div>
                </div>
                    <div id="providerIdMsg" class="smallMsg"></div>
                </div>
            </div>
            <div class="form-row">
                <label>Service Date <span>*</span></label>
                <div style="position: relative; width: 100%;">
                    <input type="datetime-local" id="serviceDate">
                    <div id="serviceDateMsg" class="smallMsg"></div>
                </div>
            </div>
            <div class="form-row">
                <label>Status <span>*</span></label>
                <div style="position: relative; width: 100%;">
                    <div class="custom-dropdown" id="dropdownContainer_bookingStatus">
                    <input type="text" id="bookingStatus_display" readonly placeholder="" onclick="toggleDropdown('bookingStatus')">
                    <input type="hidden" id="bookingStatus">
                    <div id="tableContainer_bookingStatus" class="dropdown-table-container">
                        <table class="dropdown-table" id="table_bookingStatus">
                            <thead>
                                <tr>
                                <th>Status</th>
                                </tr>
                            </thead>
                            <tbody>
                            </tbody>
                        </table>
                    </div>
                </div>
                    <div id="bookingStatusMsg" class="smallMsg"></div>
                </div>
            </div>
            <div class="form-row-full">
                <label style="padding-top: 10px;">Address <span>*</span></label>
                <div style="position: relative;">
                    <textarea id="address" maxlength="500" rows="3"></textarea>
                    <div id="addressMsg" class="smallMsg"></div>
                </div>
            </div>
            <div class="button-row">
                <button type="button" id="saveBtn" class="save-btn" onclick="save_data()">Save</button>
                <button type="button" id="prevBtn" class="prev-btn" onclick="previous_data()">Previous</button>
                <button type="button" id="nextBtn" class="next-btn" onclick="next_data()">Next</button>
                <button type="button" id="exitBtn" class="exit-btn" onclick="exit_page()">Exit</button>
            </div>
        </div>
    </div>
    <div id="confirmOverlay"
        style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 10000; justify-content: center; align-items: center;">
        <div
            style="background: white; padding: 30px; border-radius: 12px; width: 400px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
            <p id="confirmMessage" style="font-size: 18px; font-weight: 600; color: #23164f; margin-bottom: 25px;"></p>
            <div id="confirmButtons" style="display: flex; justify-content: center; gap: 15px;">
            </div>
        </div>
    </div>
    <script src="js/common.js"></script>
    <script src="js/booking_form.js"></script>
</body>
</html>
