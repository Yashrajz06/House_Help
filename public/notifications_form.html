<!DOCTYPE html>
<html>
<head>
    <title>Notifications Master</title>
    <link rel="stylesheet" href="css/common.css">
    <style>
        .form-row, .form-row-full {
            grid-template-columns: 220px 1fr;
        }
    </style>
</head>
<body>
    <div class="page-border">
        <div class="title-main">House Help Management System</div>
        <div class="title-sub">Notifications Transcation Entry</div>
        <p id="msg"></p>
        <div class="form-container">
            <div class="form-row">
                <label>Notification ID <span>*</span></label>
                <div class="id-section">
                    <input type="text" id="notificationId" readonly maxlength="10"
                        style="width: 150px; background-color:#eee; cursor:not-allowed;">
                    <div class="mode-toggle">
                        <button type="button" id="findModeBtn" class="toggle-btn"
                            onclick="navigateWithCheck(function(){ set_mode('Find'); })">Find</button>
                        <button type="button" id="newModeBtn" class="toggle-btn active"
                            onclick="navigateWithCheck(function(){ set_mode('New'); })">New</button>
                    </div>
                </div>
            </div>
            <div class="form-row">
                <label>Title <span>*</span></label>
                <div style="position: relative; width: 100%;">
                    <input type="text" id="title" maxlength="100">
                    <div id="titleMsg" class="smallMsg"></div>
                </div>
            </div>
            <div class="form-row">
                <label>User ID <span>*</span></label>
                <div style="position: relative; width: 100%;">
                    <div class="custom-dropdown" id="dropdownContainer_userId">
                    <input type="text" id="userId_display" readonly placeholder="" onclick="toggleDropdown('userId')">
                    <input type="hidden" id="userId">
                    <div id="tableContainer_userId" class="dropdown-table-container">
                        <table class="dropdown-table" id="table_userId">
                            <thead>
                                <tr>
                                <th>User ID</th>
                                <th>User Name</th>
                                </tr>
                            </thead>
                            <tbody>
                            </tbody>
                        </table>
                    </div>
                </div>
                    <div id="userIdMsg" class="smallMsg"></div>
                </div>
            </div>
            <div class="form-row">
                <label>Status <span>*</span></label>
                <div style="position: relative; width: 100%;">
                    <div class="custom-dropdown" id="dropdownContainer_isRead">
                    <input type="text" id="isRead_display" readonly placeholder="" onclick="toggleDropdown('isRead')">
                    <input type="hidden" id="isRead">
                    <div id="tableContainer_isRead" class="dropdown-table-container">
                        <table class="dropdown-table" id="table_isRead">
                            <thead>
                                <tr>
                                <th>Status</th>
                                </tr>
                            </thead>
                            <tbody>
                            </tbody>
                        </table>
                    </div>
                </div>
                    <div id="isReadMsg" class="smallMsg"></div>
                </div>
            </div>
            <div class="form-row-full">
                <label style="padding-top: 10px;">Message <span>*</span></label>
                <div style="position: relative;">
                    <textarea id="message" maxlength="500" rows="2"></textarea>
                    <div id="messageMsg" class="smallMsg"></div>
                </div>
            </div>
            <div class="button-row">
                <button type="button" id="saveBtn" class="save-btn" onclick="save_data()">Save</button>
                <button type="button" id="prevBtn" class="prev-btn" onclick="previous_data()">Previous</button>
                <button type="button" id="nextBtn" class="next-btn" onclick="next_data()">Next</button>
                <button type="button" id="exitBtn" class="exit-btn" onclick="exit_page()">Exit</button>
            </div>
        </div>
    </div>
    <div id="confirmOverlay"
        style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 10000; justify-content: center; align-items: center;">
        <div
            style="background: white; padding: 30px; border-radius: 12px; width: 400px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
            <p id="confirmMessage" style="font-size: 18px; font-weight: 600; color: #23164f; margin-bottom: 25px;"></p>
            <div id="confirmButtons" style="display: flex; justify-content: center; gap: 15px;">
            </div>
        </div>
    </div>
    <script src="js/common.js"></script>
    <script src="js/notifications_form.js"></script>
</body>
</html>
