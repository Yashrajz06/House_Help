<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Area Master Entry</title>
    <link rel="stylesheet" href="area_master.css">
    
</head>
<body>

<div id="outerbox">
    <div class="container">

        <div id="mainHeading" class="main-title">
            House Help Management System
        </div>

        <div id="subHeading" class="sub-title">
            Area Master Entry
        </div>

        <div id="messageBox" class="message-box"></div>

        <div id="formbox" class="form-box grid-form-box">
            <div class="form-grid">

                <div class="form-group">
                    <label for="area_id">Area ID <span class="star">*</span></label>
                    <div class="id-section">
                        <input type="number" id="area_id" max="9999999999" oninput="if(this.value.length > 10) this.value = this.value.slice(0,10);" readonly>
                        <button id="findBtn" style="display: none;">Find</button>
                        <div class="connected-group">
                            <button type="button" id="uiFindBtn" class="mode-btn">Find</button>
                            <button type="button" id="uiNewBtn" class="mode-btn">New</button>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="area_name">Area Name <span class="star">*</span></label>
                    <input type="text" id="area_name">
                </div>

                <div class="form-group">
                    <label for="city_id">City <span class="star">*</span></label>
                    <div class="dropdown-wrapper" id="cityWrapper">
                        <div class="input-with-arrow">
                            <input type="hidden" id="city_id" value="">
                            <input type="text" id="city_name_display" placeholder="" autocomplete="off">
                            <span id="cityDropdownArrow" class="dropdown-arrow" style="top: auto; transform: none; right: 12px;">&#9662;</span>
                        </div>
                        <div id="cityDropdown" class="table-dropdown" style="display: none;">
                            <table class="dropdown-table">
                                <thead>
                                    <tr>
                                        <th>City ID</th>
                                        <th>Country</th>
                                        <th>State</th>
                                        <th>City</th>
                                    </tr>
                                </thead>
                                <tbody id="cityDropdownBody">
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="state">State <span class="star">*</span></label>
                    <input type="text" id="state" readonly placeholder="">
                </div>

                <div class="form-group">
                    <label for="country">Country <span class="star">*</span></label>
                    <input type="text" id="country" readonly placeholder="">
                </div>

            </div>

            <div id="buttonBox" class="button-group" style="margin-top: 25px;">
                <button id="saveBtn">Save</button>
                <button id="updateBtn" style="display: none;">Update</button>
                <button id="prevBtn">Previous</button>
                <button id="nextBtn" style="display: none;">Next</button>
                <button id="exitBtn">Exit</button>
            </div>

        </div>

    </div>
</div>



<script src="areaMaster.js"></script>
<script>
    (function() {
        const originalFindBtn = document.getElementById("findBtn");
        const uiFindBtn = document.getElementById("uiFindBtn");
        const uiNewBtn = document.getElementById("uiNewBtn");
        const saveBtn = document.getElementById("saveBtn");

        if (!originalFindBtn || !uiFindBtn || !uiNewBtn) return;

        function updateActiveStates() {
            const isNewMode = (saveBtn && saveBtn.style.display !== "none");
            if (isNewMode) {
                uiNewBtn.classList.add("active");
                uiFindBtn.classList.remove("active");
            } else {
                uiFindBtn.classList.add("active");
                uiNewBtn.classList.remove("active");
            }
        }

        uiFindBtn.addEventListener("click", () => {
            originalFindBtn.innerText = "Find";
            originalFindBtn.click();
            updateActiveStates();
        });

        uiNewBtn.addEventListener("click", () => {
            originalFindBtn.innerText = "New";
            originalFindBtn.click();
            updateActiveStates();
        });

        if (saveBtn) {
            const observer = new MutationObserver(() => {
                updateActiveStates();
            });
            observer.observe(saveBtn, { attributes: true, attributeFilter: ["style"] });
        }
        updateActiveStates();
    })();
</script>

</body>
</html>
